name = "ai-ceo-studio"
main = "worker.js"
compatibility_date = "2026-11-24"

[ai]
binding = "AI"
remote = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
WEB_SEARCH_ENABLED = "false"
WEB_SEARCH_PROVIDER = "ceramic"
